[package]
name = "pqcbench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmark harness for RustCrypto ml-dsa / slh-dsa (pqc-signatures project)"

[[bin]]
name = "pqcbench"
path = "src/main.rs"

[dependencies]
ml-dsa = { path = "vendor/ml-dsa" }   # vendored 0.1.1 with internals exposed (see docs)
slh-dsa = { path = "vendor/slh-dsa" }  # vendored 0.2.0-rc.5 with internals exposed
signature = "3.0"
hybrid-array = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
libc = "0.2"
mimalloc = { version = "0.1", optional = true }
sha3 = "0.11"
keccak = "0.2"
module-lattice = { version = "0.2.3", features = ["ctutils"] }
flate2 = "1"

[features]
default = []
mimalloc = ["dep:mimalloc"]

# v0 baseline: plain `cargo build --release`
[profile.release]
opt-level = 3

# "lto" variants: fat LTO, single codegen unit, abort on panic
[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
