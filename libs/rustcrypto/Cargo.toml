[package]
name = "pqcbench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmark harness for RustCrypto ml-dsa / slh-dsa (pqc-signatures project)"

[[bin]]
name = "pqcbench"
path = "src/main.rs"

[dependencies]
ml-dsa = "0.1.1"
slh-dsa = "0.2.0-rc.5"
signature = "3.0"
hybrid-array = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
libc = "0.2"
mimalloc = { version = "0.1", optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]

# v0 baseline: plain `cargo build --release`
[profile.release]
opt-level = 3

# "lto" variants: fat LTO, single codegen unit, abort on panic
[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
